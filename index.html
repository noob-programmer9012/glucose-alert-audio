<h1>Glucose alert audio</h1>
<p>Messages played by the glucose alert calls. Each <code>.xml</code> file is the script Plivo fetches when a call is answered.</p>
<ul>
<li><a href="low.xml">low.xml</a>: glucose low<audio controls src="low.mp3"></audio></li>
<li><a href="high.xml">high.xml</a>: glucose high<audio controls src="high.mp3"></audio></li>
<li><a href="no-data.xml">no-data.xml</a>: no readings<audio controls src="no-data.mp3"></audio></li>
<li><a href="test.xml">test.xml</a>: test call<audio controls src="test.mp3"></audio></li>
</ul>
